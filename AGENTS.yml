pi-preload:
  excludes:
    - ".tasks"
  presets:
    - "pi-extension"
  extends:
    - "./pi-agents-yaml"
    - "./pi-blend"
    - "./pi-compress"
    - "./pi-cron"
    - "./pi-env"
    - "./pi-modes"
    - "./pi-preload"
    - "./pi-prompts"
    - "./pi-steering"
    - "./pi-sync"
    - "./pi-tasks"
    - "./pi-tree"
  includes:
    - "package.json"
    - "copier.yml"
    - "template/**/*"
pi-prompts:
  prompts:
    review-tests:
      body: |-
        Review all Pi extension test code available in the agent context.

        The test suites must be minimal and focused on critical behavior that each Pi extension owns. Identify tests that are duplicated, excessive, implementation-specific, or primarily test Pi, Node.js, external tools, or third-party packages.

        For each extension, provide:

        1. Tests that must remain and the critical behavior they protect.
        2. Tests that should be removed.
        3. Tests that should be combined or simplified.
        4. Test helpers, fixtures, scripts, and dependencies that will become unused.
        5. Any missing critical extension-specific coverage.

        Prefer public functions, public Pi APIs, deterministic fixtures, and small integration tests. Keep end-to-end tests only when a real Pi process boundary is necessary. Do not propose arbitrary coverage targets or replacement tests for behavior that the extension does not own.

        Produce a file-specific implementation outline. Do not make changes or use tools.
    review-custom:
      body: |-
        Identify custom, hand-rolled implementations and orchestration code that provide no benefit over an idiomatic      
        native feature, the standard library, or an existing third-party package. Replace or remove them. The goal is to   
        minimize the amount of repository code that consists of custom implementations or orchestration layers where a     
        cleaner native or packaged solution already exists.                                                                
                                                                                                                            
        For each candidate:                                                                                                
                                                                                                                            
        1. If the platform, standard library, an existing dependency, or some 3rd party package already covers the use case, use it and delete the 
            custom code.                                                                                                    
        2. Do not keep custom wrappers, parsers, scanners, state machines, or orchestration layers that duplicate existing 
            functionality.                                                                                                  
        3. Keep custom code only when it implements behavior that no available native or packaged solution provides that is hard required.
        4. if there is custom design that can be altered that allows the code to settle into being reduced n simpler via some non-custom code then it needs to be reduced n simplified.
