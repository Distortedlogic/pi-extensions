_subdirectory: template
_answers_file: .copier-answers.yml
_tasks:
  - "pre-commit install --hook-type pre-commit --hook-type pre-push"
_skip_if_exists:
  - src/index.ts
  - test/unit.test.ts
  - test/e2e.test.ts
  - README.md

project_name:
  type: str
  help: Project and package name
  default: "{{ _copier_conf.dst_path.name }}"
  validator: >-
    {% if not (project_name | regex_search('^pi-[a-z0-9]+(?:-[a-z0-9]+)*$')) %}
    Project name must start with "pi-" and contain only lowercase letters, numbers, and single hyphens.
    {% endif %}
  secret: false

project_description:
  type: str
  help: Short project description
  secret: false
