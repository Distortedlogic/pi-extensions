name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Detect project files
        id: detect
        shell: bash
        run: |
          if git ls-files --error-unmatch package.json >/dev/null 2>&1; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-files "*.py" | grep -Eq '(^|/)(test_.*|.*_test)\.py$|(^|/)tests?/.*\.py$'; then
            echo "pytest=true" >> "$GITHUB_OUTPUT"
          else
            echo "pytest=false" >> "$GITHUB_OUTPUT"
          fi

          if git ls-files "Cargo.toml" "*/Cargo.toml" | grep -q .; then
            echo "cargo=true" >> "$GITHUB_OUTPUT"
          else
            echo "cargo=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Set up Node.js
        if: steps.detect.outputs.npm == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.19.0"

      - name: Set up Rust
        if: steps.detect.outputs.cargo == 'true'
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          components: clippy, rustfmt

      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2

      - name: Run pre-commit
        run: pre-commit run --all-files

      - name: Install npm dependencies
        if: steps.detect.outputs.npm == 'true'
        run: npm ci

      - name: Run npm checks
        if: steps.detect.outputs.npm == 'true'
        run: npm run check

      - name: Verify offline Pi extension load
        if: steps.detect.outputs.npm == 'true'
        env:
          PI_OFFLINE: "1"
        run: npm run test:e2e

      - name: Verify package contents and installation
        if: steps.detect.outputs.npm == 'true'
        env:
          PI_OFFLINE: "1"
        run: |
          archive="$(npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/package-check"
          tar -xzf "$archive" -C "$RUNNER_TEMP/package-check"
          package_dir="$RUNNER_TEMP/package-check/package"
          test -f "$package_dir/package.json"
          test -f "$package_dir/src/index.ts"
          test -f "$package_dir/README.md"
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-package-agent" npm exec -- pi install "$package_dir"
          PI_CODING_AGENT_DIR="$RUNNER_TEMP/pi-package-agent" npm exec -- pi list

      - name: Install pytest
        if: steps.detect.outputs.pytest == 'true'
        run: python -m pip install pytest

      - name: Run pytest
        if: steps.detect.outputs.pytest == 'true'
        run: python -m pytest

      - name: Run Cargo checks
        if: steps.detect.outputs.cargo == 'true'
        run: |
          cargo fmt --all --check
          cargo clippy --all-targets --all-features -- -D warnings
          cargo test --all-targets --all-features
